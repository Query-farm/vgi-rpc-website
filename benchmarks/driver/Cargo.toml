[package]
name = "vgi-rpc-release-bench"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
arrow-array = "59"
arrow-schema = "59"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vgi-rpc = { version = "=0.23.2", default-features = false }
vgi-rpc-client = { version = "=0.23.2", features = ["http", "unix", "shm"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
